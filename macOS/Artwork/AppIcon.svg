<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1024 1024" width="1024" height="1024" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <!-- background: smooth, uneven colour wash instead of discrete blobs -->
    <linearGradient id="bg" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0" stop-color="#40208C"/>
      <stop offset="1" stop-color="#1C0A46"/>
    </linearGradient>
    <radialGradient id="wash1" gradientUnits="userSpaceOnUse" cx="330" cy="300" r="520" gradientTransform="translate(330 300) rotate(-25) scale(1 0.7) translate(-330 -300)">
      <stop offset="0" stop-color="#E86AE0" stop-opacity="0.42"/>
      <stop offset="0.6" stop-color="#B05CF0" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#B05CF0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="wash2" gradientUnits="userSpaceOnUse" cx="760" cy="800" r="560" gradientTransform="translate(760 800) rotate(20) scale(1 0.65) translate(-760 -800)">
      <stop offset="0" stop-color="#3FCBFF" stop-opacity="0.36"/>
      <stop offset="0.6" stop-color="#4A7BFF" stop-opacity="0.1"/>
      <stop offset="1" stop-color="#4A7BFF" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="body"><rect x="100" y="100" width="824" height="824" rx="185"/></clipPath>

    <!-- blurs -->
    <filter id="frost" x="-10%" y="-10%" width="120%" height="120%"><feGaussianBlur stdDeviation="18"/></filter>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="20"/></filter>
    <filter id="softShadow" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="28"/></filter>

    <!-- panel clip shapes -->
    <clipPath id="c1"><rect transform="translate(512 672) scale(1 0.58) rotate(45)" x="-170" y="-170" width="340" height="340" rx="84"/></clipPath>
    <clipPath id="c2"><rect transform="translate(512 562) scale(1 0.58) rotate(45)" x="-170" y="-170" width="340" height="340" rx="84"/></clipPath>
    <clipPath id="c3"><rect transform="translate(512 452) scale(1 0.58) rotate(45)" x="-170" y="-170" width="340" height="340" rx="84"/></clipPath>

    <!-- glass tints (top-lit, soft; no outlines) -->
    <linearGradient id="t1" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#6AE4FF" stop-opacity="0.58"/>
      <stop offset="1" stop-color="#4A7BFF" stop-opacity="0.26"/>
    </linearGradient>
    <linearGradient id="t2" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#FF86D6" stop-opacity="0.56"/>
      <stop offset="1" stop-color="#9B5CFF" stop-opacity="0.28"/>
    </linearGradient>
    <linearGradient id="t3" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.58"/>
      <stop offset="1" stop-color="#D9B8FF" stop-opacity="0.24"/>
    </linearGradient>
    <linearGradient id="sel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7DF6FF"/>
      <stop offset="1" stop-color="#3F8EFF"/>
    </linearGradient>

    <!-- scene 0 -->
    <g id="s0">
      <g clip-path="url(#body)">
        <rect x="100" y="100" width="824" height="824" fill="url(#bg)"/>
        <rect x="100" y="100" width="824" height="824" fill="url(#wash1)"/>
        <rect x="100" y="100" width="824" height="824" fill="url(#wash2)"/>
      </g>
    </g>

    <!-- layer 1 -->
    <g id="L1">
      <rect transform="translate(512 692) scale(1 0.58) rotate(45)" x="-170" y="-170" width="340" height="340" rx="84" fill="#10052E" opacity="0.42" filter="url(#softShadow)"/>
      <g clip-path="url(#c1)"><use href="#s0" xlink:href="#s0" filter="url(#frost)"/></g>
      <rect transform="translate(512 672) scale(1 0.58) rotate(45)" x="-170" y="-170" width="340" height="340" rx="84" fill="url(#t1)"/>
    </g>
    <g id="s1"><use href="#s0" xlink:href="#s0"/><use href="#L1" xlink:href="#L1"/></g>

    <!-- layer 2 -->
    <g id="L2">
      <rect transform="translate(512 582) scale(1 0.58) rotate(45)" x="-170" y="-170" width="340" height="340" rx="84" fill="#10052E" opacity="0.38" filter="url(#softShadow)"/>
      <g clip-path="url(#c2)"><use href="#s1" xlink:href="#s1" filter="url(#frost)"/></g>
      <rect transform="translate(512 562) scale(1 0.58) rotate(45)" x="-170" y="-170" width="340" height="340" rx="84" fill="url(#t2)"/>
    </g>
    <g id="s2"><use href="#s1" xlink:href="#s1"/><use href="#L2" xlink:href="#L2"/></g>
  </defs>

  <use href="#s2" xlink:href="#s2"/>

  <!-- layer 3 + inspected element -->
  <rect transform="translate(512 472) scale(1 0.58) rotate(45)" x="-170" y="-170" width="340" height="340" rx="84" fill="#10052E" opacity="0.38" filter="url(#softShadow)"/>
  <g clip-path="url(#c3)"><use href="#s2" xlink:href="#s2" filter="url(#frost)"/></g>
  <g transform="translate(512 452) scale(1 0.58) rotate(45)">
    <rect x="-170" y="-170" width="340" height="340" rx="84" fill="url(#t3)"/>

    <rect x="-60" y="-60" width="120" height="120" rx="34" fill="#3FE0FF" opacity="0.75" filter="url(#glow)"/>
    <rect x="-60" y="-60" width="120" height="120" rx="34" fill="url(#sel)" opacity="0.95"/>

    <g fill="none" stroke="#FFFFFF" stroke-opacity="0.95" stroke-width="15" stroke-linecap="round" stroke-linejoin="round">
      <path d="M-106 -64 V-106 H-64"/>
      <path d="M64 -106 H106 V-64"/>
      <path d="M106 64 V106 H64"/>
      <path d="M-64 106 H-106 V64"/>
    </g>
  </g>
</svg>